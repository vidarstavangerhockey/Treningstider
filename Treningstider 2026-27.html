<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treningstider – Normalsesong 2026/27</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg: #0A0D12;
    --card: #131A24;
    --card-border: #232C39;
    --gold: #F2B705;
    --gold-dim: #7A6420;
    --ice: #4FC3F7;
    --text: #E7EAEE;
    --text-dim: #8B95A5;
    --text-faint: #566072;
    --kunstlop: #F5D742;
    --andrelag: #F06BA8;
    --gray: #9AA5B4;
    --kamp: #F2914A;
    --publikumsskoyting: #B18AF0;
  }

  .tt-schedule-wrap, .tt-schedule-wrap *{box-sizing:border-box;}

  .tt-schedule-wrap{
    max-width:1500px;
    margin:0 auto;
    background:
      radial-gradient(circle at 15% 0%, rgba(79,195,247,0.06), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(242,183,5,0.05), transparent 35%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    padding: 28px 20px 60px;
  }

  .tt-schedule-wrap header{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:22px;
    border-bottom:1px solid var(--card-border);
    padding-bottom:20px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .tt-schedule-wrap h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:42px;
    letter-spacing:0.02em;
    margin:0;
    line-height:1;
    color:var(--text);
  }
  .sub{
    color:var(--text-dim);
    font-size:14px;
    max-width:820px;
    line-height:1.5;
    margin-top:4px;
  }
  .sub b{color:var(--text);font-weight:600;}
  .legend{
    display:flex;
    gap:16px;
    margin-top:12px;
    font-size:12px;
    color:var(--text-dim);
    align-items:center;
    flex-wrap:wrap;
  }
  .dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
  }
  .dot.hockey{background:var(--ice);}
  .dot.kunstlop{background:var(--kunstlop);}
  .dot.andrelag{background:var(--andrelag);}
  .dot.gray{background:var(--gray);}
  .dot.kamp{background:var(--kamp);}
  .dot.publikumsskoyting{background:var(--publikumsskoyting);}

  .tab-bar{
    display:flex;
    gap:6px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .tab-btn{
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--text-dim);
    border-radius:7px;
    padding:7px 14px;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
  }
  .tab-btn:hover{color:var(--text); border-color:var(--text-dim);}
  .tab-btn.active{
    background:linear-gradient(180deg,#1A2230,#131A24);
    border-color:var(--gold-dim);
    color:var(--gold);
  }

  .week-dates{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.03em;
    color:var(--gold);
    margin-top:10px;
    min-height:16px;
  }

  .filter-bar{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:10px 12px;
  }
  .filter-bar label{
    font-size:12.5px;
    color:var(--text-dim);
    font-weight:600;
  }
  .filter-bar select{
    background:#1A2230;
    color:var(--text);
    border:1px solid var(--card-border);
    border-radius:6px;
    padding:6px 10px;
    font-size:13px;
    font-family:'Inter', sans-serif;
    min-width:200px;
  }
  .match-count{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--gold);
  }
  .reset-btn{
    background:none;
    border:1px solid var(--card-border);
    color:var(--text-dim);
    border-radius:6px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
  }
  .reset-btn:hover{color:var(--text); border-color:var(--text-dim);}

  .rinks{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 420px));
    justify-content:center;
    gap:14px;
    align-items:start;
  }
  @media (min-width: 900px){
    .rinks{
      grid-template-columns: repeat(5, minmax(0, 1fr));
      justify-content: start;
    }
  }
  .rink{
    max-width:420px;
  }

  .rink{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .rink.no-match{opacity:0.35;}

  .rink-head{
    position:sticky;
    top:0;
    background:linear-gradient(180deg, #1A2230, #131A24);
    padding:14px 14px 12px;
    border-bottom:2px solid var(--gold-dim);
  }
  .rink-name{
    font-family:'Bebas Neue', sans-serif;
    font-size:19px;
    letter-spacing:0.02em;
    color:var(--text);
    line-height:1.15;
  }
  .rink-count{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--text-faint);
    margin-top:3px;
  }

  .day-block{
    border-top:1px solid var(--card-border);
  }
  .day-block:first-of-type{border-top:none;}
  .day-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    padding:9px 14px 5px;
  }
  .session{
    display:flex;
    align-items:baseline;
    gap:9px;
    padding:4px 14px;
    font-size:12.8px;
  }
  .session:last-child{padding-bottom:9px;}
  .time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:11.8px;
    color:var(--text-dim);
    min-width:88px;
    flex-shrink:0;
  }
  .group{
    color:var(--text);
    font-weight:500;
  }

  .session.kunstlop .time, .session.kunstlop .group{color:var(--kunstlop); font-weight:700;}
  .session.andrelag .time, .session.andrelag .group{color:var(--andrelag);}
  .session.gray .time, .session.gray .group{color:var(--gray);}
  .session.kamp .time, .session.kamp .group{color:var(--kamp); font-weight:700;}
  .session.publikumsskoyting .time, .session.publikumsskoyting .group{color:var(--publikumsskoyting);}

  .session.dimmed{opacity:0.15;}
  .session.hit{
    background:rgba(242,183,5,0.10);
    border-radius:5px;
    margin:2px 6px;
    padding:4px 8px;
  }

  .empty{
    padding:8px 14px 12px;
    font-size:12px;
    color:var(--text-faint);
    font-style:italic;
  }

  @media (max-width: 1100px){
    .rinks{grid-template-columns:repeat(3, minmax(0,1fr));}
  }
  @media (max-width: 720px){
    .tt-schedule-wrap h1{font-size:32px;}
    .rinks{grid-template-columns:1fr; gap:12px;}
    .rink-head{position:static;}
  }
</style>
</head>

  </header>

  <div class="rinks" id="rinksContainer"></div>

</div>

  let activeView = 'normalsesong';
  let DATA = VIEWS[activeView];

  function baseTeamName(name){
    return name.replace(/\s*\(P&K\)\s*$/i, '').trim();
  }

  function splitParts(baseName){
    if(baseName.includes('/') || baseName.includes('+')){
      return baseName.split(/[/+]/).map(s=>s.trim());
    }
    return [baseName];
  }

  function teamMatches(sessionBase, filterValue){
    if(filterValue === 'ALL') return true;
    return splitParts(sessionBase).includes(filterValue);
  }

  const container = document.getElementById('rinksContainer');
  const dayOrder = ["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];

  function renderRinks(data){
    container.innerHTML = '';
    const halls = [...new Set(data.map(d => d.hall))];

    halls.forEach(hall => {
      const hallData = data.filter(d => d.hall === hall);
      const rinkDiv = document.createElement('div');
      rinkDiv.className = 'rink';
      rinkDiv.dataset.hall = hall;

      const head = document.createElement('div');
      head.className = 'rink-head';
      head.innerHTML = `<div class="rink-name">${hall}</div>`;
      rinkDiv.appendChild(head);

      dayOrder.forEach(day => {
        const dayData = hallData.filter(d => d.day === day).sort((a,b)=>a.start.localeCompare(b.start));
        const dayDiv = document.createElement('div');
        dayDiv.className = 'day-block';
        dayDiv.dataset.day = day;

        const label = document.createElement('div');
        label.className = 'day-label';
        const weekInfo = WEEK_DATES[activeView];
        label.textContent = weekInfo ? `${day} ${weekInfo.days[day]}` : day;
        dayDiv.appendChild(label);

        if(dayData.length === 0){
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'Ingen treninger';
          dayDiv.appendChild(empty);
        } else {
          dayData.forEach(s => {
            const sess = document.createElement('div');
            sess.className = `session ${s.cat}`;
            sess.dataset.base = baseTeamName(s.team);
            sess.innerHTML = `<span class="time">${s.start}-${s.end}</span><span class="group">${s.team}</span>`;
            dayDiv.appendChild(sess);
          });
        }
        rinkDiv.appendChild(dayDiv);
      });

      container.appendChild(rinkDiv);
    });
  }

  function rebuildTeamFilter(data){
    const select = document.getElementById('teamFilter');
    select.innerHTML = '<option value="ALL">Alle lag / vis alt</option>';
    const teams = Array.from(new Set(data.flatMap(d => splitParts(baseTeamName(d.team))))).sort((a,b)=>a.localeCompare(b,'no'));
    teams.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      select.appendChild(opt);
    });
    document.getElementById('matchCount').textContent = '';
  }

  function updateWeekDates(view){
    const el = document.getElementById('weekDates');
    const info = WEEK_DATES[view];
    const weekNum = view.replace('uke', '');
    el.textContent = info ? `Uke ${weekNum} · ${info.range}` : '';
  }

  function switchTab(view){
    var previousTeamFilter = document.getElementById('teamFilter').value;
    activeView = view;
    DATA = VIEWS[view];
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === view);
    });
    updateWeekDates(view);
    renderRinks(DATA);
    rebuildTeamFilter(DATA);
    var teamSelectEl = document.getElementById('teamFilter');
    var stillExists = Array.prototype.some.call(teamSelectEl.options, function(opt){ return opt.value === previousTeamFilter; });
    var restoredFilter = stillExists ? previousTeamFilter : 'ALL';
    teamSelectEl.value = restoredFilter;
    filterTeam(restoredFilter);
  }

  // Første rendering
  updateWeekDates(activeView);
  renderRinks(DATA);
  rebuildTeamFilter(DATA);

  function filterTeam(value){
    const matchCountEl = document.getElementById('matchCount');
    let totalMatches = 0;

    document.querySelectorAll('.rink').forEach(rink => {
      let rinkMatches = 0;

      rink.querySelectorAll('.session[data-base]').forEach(s => {
        if(value === 'ALL'){
          s.classList.remove('dimmed','hit');
        } else if(teamMatches(s.dataset.base, value)){
          s.classList.remove('dimmed');
          s.classList.add('hit');
          rinkMatches++;
          totalMatches++;
        } else {
          s.classList.add('dimmed');
          s.classList.remove('hit');
        }
      });

      rink.querySelectorAll('.day-block').forEach(day => {
        const hasHit = day.querySelector('.session.hit');
        const hasAnySession = day.querySelector('.session[data-base]');
        if(value !== 'ALL' && hasAnySession){
          day.style.display = hasHit ? '' : 'none';
        } else {
          day.style.display = '';
        }
      });

      if(value !== 'ALL' && rinkMatches === 0){
        rink.classList.add('no-match');
      } else {
        rink.classList.remove('no-match');
      }
    });

    matchCountEl.textContent = value === 'ALL' ? '' : `${totalMatches} treningsøkt(er) funnet for ${value}`;
  }
